<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Card check complete</title>
<style>:root{--bg:#f6f3f1;--card:#fff;--ink:#3b2a2a;--muted:#7a6868;--good:#2f7a4d;--good-bg:#e5f3ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171312;--card:#211b1a;--ink:#f1e8e6;--muted:#b3a3a0;--good:#7fd6a0;--good-bg:#183326;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:40px max(16px,env(safe-area-inset-left,0px))}
.panel{max-width:460px;margin:0 auto;background:var(--card);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.tick{width:64px;height:64px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;font-size:2rem;font-weight:800}h1{margin:0;font-size:1.3rem}p{margin:0;color:var(--muted)}</style></head>
<body><div class="panel"><div class="tick" aria-hidden="true">✓</div><h1>Card check complete</h1><p>Thank you. No charge was made. You can close this page.</p></div></body></html>
